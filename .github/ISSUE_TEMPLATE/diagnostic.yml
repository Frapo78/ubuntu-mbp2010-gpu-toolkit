name: Diagnostic / compatibility problem
description: Report a boot, graphics, browser, power or hardware-compatibility problem
title: "[diagnostic] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please collect evidence before changing the system. If Ubuntu is usable, run `scripts/collect-diagnostics.sh` and attach or paste a **redacted** report.

  - type: input
    id: model
    attributes:
      label: Mac model identifier
      description: Output of `cat /sys/devices/virtual/dmi/id/product_name`
      placeholder: MacBookPro6,2
    validations:
      required: true

  - type: input
    id: ubuntu
    attributes:
      label: Ubuntu release
      placeholder: Ubuntu 24.04.4 LTS
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: Output of `uname -r`
      placeholder: 7.0.0-29-generic
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Graphical session
      options:
        - X11
        - Wayland
        - No graphical session / boot failure
        - Unknown
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: Exact symptom
      description: Describe what happens, when it starts and whether the machine recovers without a hard power-off.
    validations:
      required: true

  - type: textarea
    id: last-change
    attributes:
      label: Last persistent change before the problem
      description: Examples: Ubuntu/kernel update, OpenCore change, GRUB option, Xorg config, driver/package change, gmux experiment.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include whether it happens before launching Chromium or another GPU-heavy app.
    validations:
      required: true

  - type: textarea
    id: gpu
    attributes:
      label: GPU / switcheroo state
      description: Paste `lspci -nnk` GPU lines, `switcherooctl list`, and `vga_switcheroo` output if available.
      render: shell

  - type: textarea
    id: display
    attributes:
      label: Display layout
      description: On X11 paste `xrandr --listactivemonitors` and connected/disconnected outputs.
      render: shell

  - type: textarea
    id: errors
    attributes:
      label: Relevant errors with timestamps
      description: Prefer journal/kernel excerpts around the actual failure. Do not paste an unrelated full journal.
      render: shell

  - type: textarea
    id: report
    attributes:
      label: Diagnostic report or link
      description: Attach the output generated by `scripts/collect-diagnostics.sh`, after checking it for sensitive data.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I have not included passwords, tokens, serial numbers or unrelated private data.
          required: true
        - label: I have stated the last persistent change I made before the problem.
          required: true
        - label: I understand experimental scripts are model-specific and are not automatic fixes.
          required: true
