name: Validate toolkit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate machine-readable knowledge and profiles
        run: python3 tests/test_repository.py

      - name: Validate package manifests and offline safety policy
        run: python3 tests/test_packages.py

      - name: Parse all shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Validate JSON syntax independently
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "json $file"
            python3 -m json.tool "$file" >/dev/null
          done < <(find knowledge profiles packages -type f -name '*.json' -print0)
